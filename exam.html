<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Exams · CISM Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2557d6">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
<main class="wrap narrow" id="app"></main>
<script src="data/domains.js"></script>
<script src="data/questions-d1.js"></script><script src="data/questions-d2.js"></script><script src="data/questions-d3.js"></script><script src="data/questions-d4.js"></script>
<script src="assets/js/core.js"></script>
<script>
const Q = Object.fromEntries(CISM_Q.map(q => [q.id, q]));
const app = document.getElementById("app");
const L = "ABCD";
let S = null, tick = null; // current session

const MODES = {
  full:  { name: "Full mock exam", n: 150, mins: 240, instant: false, desc: "150 questions in 4 hours, weighted like the real exam. No feedback until you submit." },
  half:  { name: "Half mock", n: 75, mins: 120, instant: false, desc: "75 questions in 2 hours. Good for a weekday evening." },
  quick: { name: "Quick quiz", n: 25, mins: 0, instant: true, desc: "25 mixed questions with instant feedback and explanations." },
  drill: { name: "Domain drill", n: 0, mins: 0, instant: true, desc: "Every question from one domain, with instant feedback." },
  missed:{ name: "Review mistakes", n: 0, mins: 0, instant: true, desc: "Only questions you got wrong last time. Clear them by answering correctly." }
};

// ── Question selection ──
function weightedPick(n) {
  const seen = store.get("seen", {});
  const pickFrom = list => shuffle(list).sort((a, b) => (seen[a.id] || 0) - (seen[b.id] || 0));
  const want = CISM_DOMAINS.map(d => Math.round(n * d.weight / 100));
  want[2] += n - want.reduce((a, b) => a + b, 0); // fix rounding on the largest domain
  let out = [];
  CISM_DOMAINS.forEach((d, k) => out.push(...pickFrom(CISM_Q.filter(q => q.d === d.n)).slice(0, want[k])));
  if (out.length < n) out.push(...pickFrom(CISM_Q.filter(q => !out.includes(q))).slice(0, n - out.length));
  return shuffle(out);
}
function start(modeKey, domain) {
  const m = MODES[modeKey];
  let qs;
  if (modeKey === "drill") qs = shuffle(CISM_Q.filter(q => q.d === domain));
  else if (modeKey === "missed") qs = shuffle(store.get("missed", []).map(id => Q[id]).filter(Boolean));
  else qs = weightedPick(Math.min(m.n, CISM_Q.length));
  if (!qs.length) return;
  const instant = modeKey === "full" || modeKey === "half" ? document.getElementById("fbToggle")?.checked === true : m.instant;
  S = {
    mode: modeKey, domain: domain || 0, instant, cur: 0, started: Date.now(),
    endsAt: m.mins ? Date.now() + m.mins * 6e4 : 0,
    items: qs.map(q => ({ id: q.id, order: shuffle([0, 1, 2, 3]), pick: null, flag: false }))
  };
  save(); renderExam();
}
function save() { store.set("session", S); }

// ── Screens ──
function renderHome() {
  clearInterval(tick);
  const hist = store.get("history", []);
  const missed = store.get("missed", []).filter(id => Q[id]);
  const resume = store.get("session", null);
  const counts = [1, 2, 3, 4].map(n => CISM_Q.filter(q => q.d === n).length);
  app.innerHTML = `
    <div class="eyebrow">${CISM_Q.length} original questions</div>
    <h1 style="margin:8px 0 10px">Practice exams</h1>
    <p class="lead">CISM questions test judgement. Read every explanation, especially for the ones you got right by guessing.</p>
    ${resume && resume.items ? `<div class="notice" style="background:var(--accent-soft)"><span>↻</span><div style="flex:1"><b style="color:var(--accent)">Unfinished ${esc(MODES[resume.mode].name.toLowerCase())}</b> — question ${resume.cur + 1} of ${resume.items.length}.
      <div class="btn-row" style="margin-top:8px"><button class="btn sm primary" id="resume">Resume</button><button class="btn sm" id="discard">Discard</button></div></div></div>` : ""}
    <div class="grid g2 section" style="margin-top:24px">
      ${["full", "half", "quick"].map(k => `<div class="card mode"><h3>${MODES[k].name}${MODES[k].mins ? `<span class="chip">${MODES[k].mins / 60}h</span>` : ""}</h3><p>${MODES[k].desc}</p><button class="btn ${k === "full" ? "primary" : ""}" data-start="${k}">Start</button></div>`).join("")}
      <div class="card mode"><h3>${MODES.missed.name}<span class="chip">${missed.length}</span></h3><p>${MODES.missed.desc}</p><button class="btn" data-start="missed" ${missed.length ? "" : "disabled"}>Start</button></div>
    </div>
    <label class="opts check"><input type="checkbox" id="fbToggle"> Show answers instantly in mock exams (study mode)</label>
    <div class="section">
      <h2>Domain drills</h2>
      <div class="grid g4" style="margin-top:14px">${CISM_DOMAINS.map((d, k) => `<button class="card link mode dcard" style="--dc:var(--d${d.n});text-align:left" data-drill="${d.n}">
        <span class="dchip d${d.n}c" style="align-self:flex-start">D${d.n} · ${d.weight}%</span><b style="margin-top:6px">${esc(d.short)}</b><span class="small muted">${counts[k]} questions</span></button>`).join("")}</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>History</h2>${hist.length ? '<button class="btn sm" id="clearHist">Clear</button>' : ""}</div>
      ${hist.length ? `<div class="tbl hist"><table><tr><th>Date</th><th>Mode</th><th>Questions</th><th>Score</th></tr>
        ${hist.slice().reverse().slice(0, 15).map(h => `<tr><td>${new Date(h.at).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</td><td>${esc(h.label)}</td><td class="mono">${h.n}</td>
        <td class="mono" style="color:${h.pct >= 75 ? "var(--good)" : h.pct >= 60 ? "var(--warn)" : "var(--bad)"}">${h.pct}%</td></tr>`).join("")}</table></div>`
        : '<p class="muted">No attempts yet. Your scores will appear here.</p>'}
    </div>`;
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => start(b.dataset.start));
  app.querySelectorAll("[data-drill]").forEach(b => b.onclick = () => start("drill", +b.dataset.drill));
  const r = document.getElementById("resume"); if (r) r.onclick = () => { S = resume; renderExam(); };
  const ds = document.getElementById("discard"); if (ds) ds.onclick = () => { store.del("session"); renderHome(); };
  const ch = document.getElementById("clearHist"); if (ch) ch.onclick = () => { if (confirm("Clear exam history?")) { store.set("history", []); renderHome(); } };
}

function fmt(ms) { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(x).padStart(2, "0"); }

function renderExam() {
  const it = S.items[S.cur], q = Q[it.id], d = dname(q.d);
  const answered = S.items.filter(x => x.pick != null).length;
  const reveal = S.instant && it.pick != null;
  const label = S.mode === "drill" ? `Domain ${S.domain} drill` : MODES[S.mode].name;
  app.innerHTML = `
    <div class="ex-bar"><div class="ex-bar-in">
      <b class="small">${esc(label)}</b><div class="bar"><i style="width:${answered / S.items.length * 100}%"></i></div>
      <span class="small mono muted">${answered}/${S.items.length}</span>
      ${S.endsAt ? '<span class="timer" id="timer"></span>' : ""}
      <button class="btn sm" id="quit">Exit</button>
    </div></div>
    <div class="qcard">
      <div class="qmeta"><span class="mono small muted">Q${S.cur + 1}</span><span class="dchip d${q.d}c">D${q.d} · ${q.s}</span><span class="small muted">${esc(d.short)}</span>
        <button class="btn sm flag${it.flag ? " on" : ""}" id="flag" style="margin-left:auto">⚑ ${it.flag ? "Flagged" : "Flag"}</button></div>
      <div class="qtext">${esc(q.q)}</div>
      ${it.order.map((oi, k) => {
        let cls = "";
        if (reveal) cls = oi === q.a ? "right" : (it.pick === oi ? "wrong" : "");
        else if (it.pick === oi) cls = "sel";
        return `<button class="opt ${cls}" data-o="${oi}" ${reveal ? "disabled" : ""}><span class="l">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`;
      }).join("")}
      ${reveal ? `<div class="explain"><div class="v" style="color:${it.pick === q.a ? "var(--good)" : "var(--bad)"}">${it.pick === q.a ? "Correct" : "Not quite — the answer is " + L[it.order.indexOf(q.a)]}</div>${esc(q.e)}</div>` : ""}
      <div class="ex-nav">
        <button class="btn" id="prev" ${S.cur ? "" : "disabled"}>← Previous</button>
        ${S.cur < S.items.length - 1 ? '<button class="btn primary" id="next">Next →</button>' : '<button class="btn primary" id="submit">Finish &amp; score</button>'}
      </div>
    </div>
    <div class="dots" id="dots">${S.items.map((x, k) => {
      let c = k === S.cur ? "cur " : "";
      if (x.pick != null) c += S.instant ? (x.pick === Q[x.id].a ? "r" : "w") : "ans";
      if (x.flag) c += " fl";
      return `<button class="${c}" data-j="${k}" aria-label="Question ${k + 1}">${k + 1}</button>`;
    }).join("")}</div>
    <p class="small muted" style="margin-top:12px">Keys: <span class="mono">A–D</span> answer · <span class="mono">←/→</span> move · <span class="mono">F</span> flag</p>`;

  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.o));
  document.getElementById("flag").onclick = () => { it.flag = !it.flag; save(); renderExam(); };
  document.getElementById("prev").onclick = () => go(S.cur - 1);
  const nx = document.getElementById("next"); if (nx) nx.onclick = () => go(S.cur + 1);
  const sb = document.getElementById("submit"); if (sb) sb.onclick = confirmSubmit;
  document.getElementById("quit").onclick = () => { save(); renderHome(); };
  document.getElementById("dots").onclick = e => { const b = e.target.closest("button"); if (b) go(+b.dataset.j); };
  startTimer();
}
function pick(o) {
  const it = S.items[S.cur];
  if (S.instant && it.pick != null) return;
  it.pick = o; save(); renderExam();
}
function go(k) { if (k < 0 || k >= S.items.length) return; S.cur = k; save(); renderExam(); scrollTo(0, 0); }
function confirmSubmit() {
  const left = S.items.filter(x => x.pick == null).length, fl = S.items.filter(x => x.flag).length;
  if ((left || fl) && !confirm(`${left ? left + " unanswered" : ""}${left && fl ? " and " : ""}${fl ? fl + " flagged" : ""} question(s). Submit anyway?`)) return;
  finish();
}
function startTimer() {
  clearInterval(tick);
  if (!S.endsAt) return;
  const upd = () => {
    const el = document.getElementById("timer"); const left = S.endsAt - Date.now();
    if (el) { el.textContent = fmt(left); el.classList.toggle("low", left < 10 * 6e4); }
    if (left <= 0) { clearInterval(tick); alertTimeUp(); }
  };
  upd(); tick = setInterval(upd, 1000);
}
function alertTimeUp() { finish(true); }

function finish(timeUp) {
  clearInterval(tick);
  const items = S.items.map(x => ({ ...x, ok: x.pick === Q[x.id].a }));
  const right = items.filter(x => x.ok).length, pct = Math.round(right / items.length * 100);
  // update seen + missed lists
  const seen = store.get("seen", {}); items.forEach(x => seen[x.id] = (seen[x.id] || 0) + 1); store.set("seen", seen);
  const missed = new Set(store.get("missed", []));
  items.forEach(x => { if (x.ok) missed.delete(x.id); else if (x.pick != null || S.mode !== "missed") missed.add(x.id); });
  store.set("missed", [...missed]);
  const label = S.mode === "drill" ? `D${S.domain} drill` : MODES[S.mode].name;
  const hist = store.get("history", []); hist.push({ at: Date.now(), label, n: items.length, pct }); store.set("history", hist.slice(-100));
  store.del("session");
  renderResults(items, right, pct, label, timeUp);
}

function ring(pct) {
  const r = 64, c = 2 * Math.PI * r, col = pct >= 75 ? "var(--good)" : pct >= 60 ? "var(--warn)" : "var(--bad)";
  return `<div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="${r}" stroke="var(--bg-3)" stroke-width="12" fill="none"/>
    <circle cx="75" cy="75" r="${r}" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${c * pct / 100} ${c}"/></svg>
    <div class="val"><div><b>${pct}%</b><span>score</span></div></div></div>`;
}
function renderResults(items, right, pct, label, timeUp) {
  const verdict = pct >= 80 ? "Exam-ready on this set" : pct >= 75 ? "On target" : pct >= 60 ? "Getting there" : "Keep studying";
  const byD = CISM_DOMAINS.map(d => { const xs = items.filter(x => Q[x.id].d === d.n); return { d, n: xs.length, r: xs.filter(x => x.ok).length }; }).filter(x => x.n);
  const weakest = byD.slice().sort((a, b) => a.r / a.n - b.r / b.n)[0];
  let filter = "wrong";
  app.innerHTML = `
    <div class="eyebrow">${esc(label)} · results${timeUp ? " · time ran out" : ""}</div>
    <div class="result-hero card" style="margin-top:12px">${ring(pct)}
      <div><div class="verdict">${verdict}</div><p class="muted" style="margin:6px 0 12px">${right} of ${items.length} correct. Aim for a steady 75%+ on full mocks before booking the exam.${weakest && byD.length > 1 ? ` Weakest area: <b>D${weakest.d.n} ${esc(weakest.d.short)}</b>.` : ""}</p>
      <div class="btn-row"><button class="btn primary" id="again">Back to exams</button>${weakest ? `<a class="btn" href="study.html#d${weakest.d.n}">Review D${weakest.d.n} notes</a>` : ""}</div></div>
    </div>
    <div class="section"><h2>By domain</h2><div style="margin-top:10px">${byD.map(x => `<div class="drow"><span><span class="dchip d${x.d.n}c">D${x.d.n}</span> ${esc(x.d.short)}</span>
      <div class="bar"><i style="width:${x.r / x.n * 100}%;background:var(--d${x.d.n})"></i></div><span class="mono small" style="text-align:right">${x.r}/${x.n}</span></div>`).join("")}</div></div>
    <div class="section"><div class="section-head"><h2>Review answers</h2><div class="seg" id="rf">
      <button data-f="wrong">Wrong (${items.filter(x => !x.ok).length})</button><button data-f="flag">Flagged (${items.filter(x => x.flag).length})</button><button data-f="all">All</button></div></div>
      <div id="rl"></div></div>`;
  const draw = () => {
    app.querySelectorAll("#rf button").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
    const list = items.map((x, k) => [x, k]).filter(([x]) => filter === "all" || (filter === "wrong" ? !x.ok : x.flag));
    document.getElementById("rl").innerHTML = list.length ? list.map(([x, k]) => { const q = Q[x.id];
      return `<div class="rev"><div class="qmeta"><span class="mono small muted">Q${k + 1}</span><span class="dchip d${q.d}c">D${q.d} · ${q.s}</span><span class="small" style="color:${x.ok ? "var(--good)" : "var(--bad)"};margin-left:auto">${x.ok ? "Correct" : x.pick == null ? "Not answered" : "Wrong"}</span></div>
        <div class="qtext">${esc(q.q)}</div>
        ${x.pick != null && !x.ok ? `<div class="a" style="color:var(--bad)">✗ Your answer: ${esc(q.o[x.pick])}</div>` : ""}
        <div class="a" style="color:var(--good)">✓ ${esc(q.o[q.a])}</div>
        <div class="explain">${esc(q.e)}</div></div>`; }).join("") : '<p class="muted">Nothing here.</p>';
  };
  app.querySelector("#rf").onclick = e => { const b = e.target.closest("button"); if (b) { filter = b.dataset.f; draw(); } };
  document.getElementById("again").onclick = renderHome;
  draw(); scrollTo(0, 0);
}

addEventListener("keydown", e => {
  if (!S || !document.querySelector(".qcard") || e.target.matches("input,select,textarea") || e.metaKey || e.ctrlKey) return;
  const k = e.key.toUpperCase();
  if ("ABCD".includes(k) && k.length === 1) { const it = S.items[S.cur]; pick(it.order[L.indexOf(k)]); }
  else if (e.key === "ArrowRight") go(S.cur + 1);
  else if (e.key === "ArrowLeft") go(S.cur - 1);
  else if (k === "F") { S.items[S.cur].flag = !S.items[S.cur].flag; save(); renderExam(); }
});

// deep link from study guide: exam.html?domain=2
const dq = +new URLSearchParams(location.search).get("domain");
if (dq >= 1 && dq <= 4) { history.replaceState(null, "", "exam.html"); start("drill", dq); } else renderHome();
</script>
</body>
</html>
